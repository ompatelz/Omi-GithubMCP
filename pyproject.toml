[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repopilot-mcp"
version = "0.1.0"
description = "Minimal RepoPilot Model Context Protocol server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Om Patel" }]
dependencies = [
    "httpx>=0.28",
    "mcp[cli]>=2,<3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.scripts]
repopilot-mcp = "repopilot.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
